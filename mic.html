<!doctype html>
<html>
  <title>VoIP AI Mic Interface</title>
  <head>
    <style>
      body {
        background-color: #0d1117;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .callcard {
        background-color: #161b22;
        border-radius: 20%;
        align-items: center;
        justify-content: center;
        display: flex;
        flex-direction: column;
        width: 320px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        text-align: center;
        padding: 3.5rem;
      }
      .callbtn {
        border: none;
        cursor: pointer;
        height: 70px;
        width: 100%;
        border-radius: 6px;
        margin-bottom: 2%;
        font-size: large;
      }
      .connstatus {
        background-color: rgba(128, 128, 128, 0.183);
        color: grey;
        margin-top: 5%;
        padding: 4px 12px;
      }
    </style>
  </head>
  <body>
    <div class="callcard">
      <h1 style="color: white; margin-bottom: 50px">Connect to XYZ Forex</h1>
      <button
        id="startbtn"
        class="callbtn"
        style="background-color: rgba(0, 215, 0, 0.797)"
      >
        Start Call
      </button>
      <button
        id="endbtn"
        class="callbtn"
        style="background-color: rgba(255, 0, 0, 0.751)"
      >
        End Call
      </button>
      <div id="connstat" class="connstatus">
        Connection Status: Disconnected
      </div>
    </div>
    <audio id="remoteAudio" autoplay></audio>

    <script>
      const startbtn = document.getElementById("startbtn");
      const endbtn = document.getElementById("endbtn");
      const statusDiv = document.getElementById("connstat");
      const remoteAudio = document.getElementById("remoteAudio");

      let localStream = null;
      let peerConnection = null;

      function updateStatus(stateText) {
        statusDiv.innerText = `Connection Status: ${stateText}`;
      }

      startbtn.onclick = async () => {
        try {
          updateStatus("Requesting Mic...");
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false,
          });
          console.log("Mic connected succesfully");
          updateStatus("Mic Connected");

          peerConnection = new RTCPeerConnection();

          localStream.getTracks().forEach((track) => {
            peerConnection.addTrack(track, localStream);
          });
          peerConnection.ontrack = (event) => {
            if (event.streams && event.streams[0]) {
              remoteAudio.srcObject = event.streams[0];
            }
          };
          console.log("WebRTC Connected");
          updateStatus("WebRTC Ready");
        } catch (err) {
          console.error(err);
          updateStatus("Failed to Connect");
        }
      };
    </script>
  </body>
</html>
